<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Sign In | ApplianceHub</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0F172A',
              light: '#F8FAFC',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-hub-light dark:bg-slate-900 text-hub-dark dark:text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white transition-colors duration-200 min-h-screen flex flex-col">

  <!-- TOP MINI BAR -->
  <div class="bg-slate-950 text-slate-400 text-xs py-2 px-4 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-1.5 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Store
      </a>
      <div class="flex items-center gap-1.5">
        <!-- RTL TOGGLE (3-MINUS / 3-DASH SYMBOL) -->
        <button id="rtlToggleBtn" onclick="toggleRTL()" class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 text-[10px] font-bold transition-all flex items-center gap-1.5" title="Toggle Direction (LTR/RTL)">
          <span class="font-mono text-sm leading-none tracking-tighter">&#8801;</span>
          <span id="rtlLabel" class="uppercase font-extrabold">RTL</span>
        </button>
        <!-- DARK MODE TOGGLE -->
        <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 transition-all" title="Toggle Dark/Light Mode">
          <i data-lucide="moon" id="themeIcon" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- LOGIN / SIGN UP CONTAINER -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-6">

      <!-- BRAND -->
      <a href="index.html" class="flex items-center justify-center gap-3">
        <div class="w-11 h-11 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-md shadow-hub-blue/20">
          <i data-lucide="wrench" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-hub-dark dark:text-white block leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5 block">Store & Service</span>
        </div>
      </a>

      <div class="bg-white dark:bg-slate-800 border border-hub-border dark:border-slate-700/80 p-8 rounded-3xl shadow-xl space-y-6">

        <!-- TABS -->
        <div class="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl text-xs font-bold">
          <button id="tabSignInBtn" onclick="switchTab('signin')" class="py-2.5 rounded-xl bg-white dark:bg-slate-800 text-hub-blue shadow-sm transition-all">
            Sign In
          </button>
          <button id="tabSignUpBtn" onclick="switchTab('signup')" class="py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:text-hub-dark dark:hover:text-white transition-all">
            Create Account
          </button>
        </div>

        <!-- ALERT -->
        <p id="authError" class="hidden text-[11px] font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/20 rounded-xl px-3 py-2 flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
          <span id="authErrorText">Something went wrong. Please try again.</span>
        </p>
        <p id="authSuccess" class="hidden text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 rounded-xl px-3 py-2 flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 shrink-0"></i>
          <span id="authSuccessText">Success!</span>
        </p>

        <!-- SIGN IN FORM -->
        <form id="signinForm" onsubmit="handleSignIn(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input type="email" required placeholder="you@example.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-hub-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue placeholder:text-slate-400">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300">Password</label>
              <a href="#forgot" onclick="showForgotPassword(event)" class="text-[11px] font-bold text-hub-blue hover:underline">Forgot password?</a>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input type="password" id="signinPassword" required placeholder="Enter your password" class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-hub-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue placeholder:text-slate-400">
              <button type="button" onclick="togglePasswordVisibility('signinPassword', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-hub-blue">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <label class="flex items-center gap-2 text-[11px] font-semibold text-slate-500 dark:text-slate-400">
            <input type="checkbox" class="rounded border-hub-border dark:border-slate-700 text-hub-blue focus:ring-hub-blue">
            Keep me signed in on this device
          </label>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/25 transition-all flex items-center justify-center gap-2">
            <span>Sign In</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signupForm" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input type="text" required placeholder="Jane Doe" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-hub-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue placeholder:text-slate-400">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input type="email" required placeholder="you@example.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-hub-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue placeholder:text-slate-400">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input type="password" id="signupPassword" required minlength="8" placeholder="At least 8 characters" class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-hub-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue placeholder:text-slate-400">
              <button type="button" onclick="togglePasswordVisibility('signupPassword', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-hub-blue">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <label class="flex items-start gap-2 text-[11px] font-semibold text-slate-500 dark:text-slate-400">
            <input type="checkbox" required class="mt-0.5 rounded border-hub-border dark:border-slate-700 text-hub-blue focus:ring-hub-blue">
            I agree to the Terms of Service and Privacy Policy
          </label>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/25 transition-all flex items-center justify-center gap-2">
            <span>Create Account</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- DIVIDER -->
        <div class="flex items-center gap-3">
          <span class="flex-1 h-px bg-hub-border dark:bg-slate-700"></span>
          <span class="text-[10px] font-bold uppercase text-slate-400">Or continue with</span>
          <span class="flex-1 h-px bg-hub-border dark:bg-slate-700"></span>
        </div>

        <!-- SOCIAL BUTTONS -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="handleSocialLogin('Google')" class="py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-hub-dark dark:text-white transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.8 6.4 2.8 11.5S6.9 20.8 12 20.8c6.9 0 9.6-4.9 9.6-7.4 0-.5-.1-.9-.1-1.2H12z"/></svg>
            Google
          </button>
          <button type="button" onclick="handleSocialLogin('Facebook')" class="py-2.5 rounded-xl border border-hub-border dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-hub-dark dark:text-white transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="#1877F2" viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0022 12z"/></svg>
            Facebook
          </button>
        </div>

      </div>

      <p class="text-center text-[11px] text-slate-400">
        Looking to manage the store instead?
        <a href="admin/index.html" class="text-hub-blue font-bold hover:underline">Go to Admin Portal</a>
      </p>

    </div>
  </main>

  <footer class="text-center text-[11px] text-slate-400 py-6">
    <p>&copy; 2026 ApplianceHub Inc. All rights reserved.</p>
  </footer>

  <script>
    // ---------------------------------------------------------------
    // TAB SWITCHING
    // ---------------------------------------------------------------
    function switchTab(tab) {
      const signinForm = document.getElementById('signinForm');
      const signupForm = document.getElementById('signupForm');
      const signinBtn = document.getElementById('tabSignInBtn');
      const signupBtn = document.getElementById('tabSignUpBtn');
      const activeClasses = ['bg-white', 'dark:bg-slate-800', 'text-hub-blue', 'shadow-sm'];
      const inactiveClasses = ['text-slate-500', 'dark:text-slate-400'];

      hideAlerts();

      if (tab === 'signup') {
        signinForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        signupBtn.classList.add(...activeClasses);
        signinBtn.classList.remove(...activeClasses);
        signinBtn.classList.add(...inactiveClasses);
        signupBtn.classList.remove(...inactiveClasses);
      } else {
        signupForm.classList.add('hidden');
        signinForm.classList.remove('hidden');
        signinBtn.classList.add(...activeClasses);
        signupBtn.classList.remove(...activeClasses);
        signupBtn.classList.add(...inactiveClasses);
        signinBtn.classList.remove(...inactiveClasses);
      }
    }

    // ---------------------------------------------------------------
    // FORM HANDLERS (demo-only, no backend wired up yet)
    // ---------------------------------------------------------------
    function handleSignIn(event) {
      event.preventDefault();
      hideAlerts();
      const email = event.target.querySelector('input[type="email"]').value.trim();

      if (!email) {
        showError('Please enter a valid email address.');
        return;
      }

      localStorage.setItem('isCustomerLoggedIn', 'true');
      localStorage.setItem('customerEmail', email);
      showSuccess('Signed in successfully! Redirecting...');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    }

    function handleSignUp(event) {
      event.preventDefault();
      hideAlerts();
      const email = event.target.querySelector('input[type="email"]').value.trim();
      const name = event.target.querySelector('input[type="text"]').value.trim();

      localStorage.setItem('isCustomerLoggedIn', 'true');
      localStorage.setItem('customerEmail', email);
      localStorage.setItem('customerName', name);
      showSuccess('Account created! Redirecting you to the store...');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    }

    function handleSocialLogin(provider) {
      hideAlerts();
      showSuccess(`Redirecting to sign in with ${provider}...`);
    }

    function showForgotPassword(event) {
      event.preventDefault();
      hideAlerts();
      showSuccess('If an account exists for that email, a reset link has been sent.');
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
      if (window.lucide) lucide.createIcons();
    }

    function showError(message) {
      const el = document.getElementById('authError');
      document.getElementById('authErrorText').innerText = message;
      el.classList.remove('hidden');
    }

    function showSuccess(message) {
      const el = document.getElementById('authSuccess');
      document.getElementById('authSuccessText').innerText = message;
      el.classList.remove('hidden');
    }

    function hideAlerts() {
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authSuccess').classList.add('hidden');
    }

    // ---------------------------------------------------------------
    // RTL & DARK MODE TOGGLES (same behaviour as the rest of the site)
    // ---------------------------------------------------------------
    function toggleRTL() {
      const htmlElement = document.documentElement;
      const rtlLabel = document.getElementById('rtlLabel');

      if (htmlElement.getAttribute('dir') === 'rtl') {
        htmlElement.setAttribute('dir', 'ltr');
        rtlLabel.innerText = 'RTL';
      } else {
        htmlElement.setAttribute('dir', 'rtl');
        rtlLabel.innerText = 'LTR';
      }
    }

    function toggleDarkMode() {
      const htmlElement = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');

      if (htmlElement.classList.contains('dark')) {
        htmlElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        htmlElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      }

      if (window.lucide) lucide.createIcons();
    }

    // Already signed in? Send them back to the store.
    if (localStorage.getItem('isCustomerLoggedIn') === 'true') {
      // Not auto-redirecting so users can still switch accounts from here;
      // uncomment the next line if you'd rather skip this page entirely.
      // window.location.replace('index.html');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
