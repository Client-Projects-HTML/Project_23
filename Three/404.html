<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>404 - Page Not Found | ApplianceHub</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0B132B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white min-h-screen flex flex-col justify-between">

  <!-- TOP BAR -->
  <div class="bg-slate-900/80 text-slate-400 text-xs py-2.5 px-4 border-b border-slate-800">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
        <span class="font-medium text-slate-300">Navigation Error</span>
      </div>
      <a href="../index.html" class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Main Store
      </a>
    </div>
  </div>

  <!-- MAIN 404 CONTENT -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-lg text-center space-y-6">
      
      <!-- GLOWING ERROR ICON CONTAINER -->
      <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
        <div class="absolute inset-0 bg-hub-blue/20 rounded-3xl blur-xl"></div>
        <div class="relative w-24 h-24 bg-gradient-to-tr from-slate-900 to-slate-800 border border-slate-700/80 rounded-3xl flex items-center justify-center shadow-2xl">
          <i data-lucide="alert-octagon" class="w-12 h-12 text-hub-blue"></i>
        </div>
      </div>

      <!-- ERROR MESSAGE -->
      <div class="space-y-2">
        <span class="text-xs font-mono font-bold text-hub-blue uppercase tracking-widest bg-hub-blue/10 px-3 py-1 rounded-full border border-hub-blue/20">Error 404</span>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Page Not Found</h1>
        <p class="text-xs sm:text-sm text-slate-400 max-w-sm mx-auto">
          The requested page or portal record does not exist or has been moved to another path.
        </p>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
        <a href="dashboard.html" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/20 transition-all flex items-center justify-center gap-2">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Admin Dashboard</span>
        </a>

        <a href="../index.html" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white text-xs font-bold transition-all flex items-center justify-center gap-2">
          <i data-lucide="store" class="w-4 h-4"></i>
          <span>Customer Storefront</span>
        </a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 text-slate-500 py-6 border-t border-slate-900 text-xs text-center">
    <p>© 2026 ApplianceHub Inc. All rights reserved.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
