<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>404 Page Not Found | ApplianceHub</title>
  <meta name="description" content="The page you requested could not be found on ApplianceHub. Return to our homepage or search for products.">

  <!-- Google Fonts & Vanilla CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0F172A',
              light: '#F8FAFC',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/theme.js?v=2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden transition-colors duration-200">

  <!-- TOP-RIGHT FLOATING CONTROLS (RTL & THEME) -->
  <div class="absolute top-4 end-4 flex items-center gap-2 z-20">
    <button id="rtlToggleBtn" onclick="toggleRTL()" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 shadow-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition-all" title="Toggle Direction (LTR/RTL)">
      <i data-lucide="globe" class="w-4 h-4"></i>
    </button>
    <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 shadow-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition-all" title="Toggle Dark/Light Mode">
      <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- STANDALONE 404 CARD -->
  <main class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl p-8 sm:p-12 text-center space-y-6 border border-slate-200 dark:border-slate-800 relative z-10 my-auto">
    
    <!-- BRAND LOGO HEADER -->
    <a href="index.html" class="inline-flex items-center gap-2 sm:gap-3 mb-2 shrink-0">
      <div class="w-8 h-8 sm:w-10 sm:h-10 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-xl sm:rounded-2xl flex items-center justify-center font-bold text-base sm:text-xl shadow-md shadow-hub-blue/20">
        <i data-lucide="wrench" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <span class="font-extrabold text-lg sm:text-xl tracking-tight text-hub-dark dark:text-white leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
    </a>

    <!-- ICON CONTAINER -->
    <div class="mx-auto w-20 h-20 bg-sky-50 dark:bg-slate-800/80 rounded-3xl flex items-center justify-center border border-sky-100 dark:border-slate-700 shadow-inner">
      <i data-lucide="alert-triangle" class="w-10 h-10 text-hub-blue"></i>
    </div>

    <!-- ERROR MESSAGE -->
    <div class="space-y-3">
      <span class="inline-block px-3.5 py-1 rounded-full bg-hub-blue/10 text-hub-blue text-xs font-black uppercase tracking-widest">Error 404</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight">Page Not Found</h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-xs mx-auto leading-relaxed">
        The appliance, model, or service page you are looking for has been moved or is temporarily unavailable.
      </p>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
      <a href="index.html" class="w-full flex-1 px-6 py-3.5 rounded-2xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/20 transition-all text-center flex items-center justify-center gap-2">
        <i data-lucide="home" class="w-4 h-4"></i> Back to Home
      </a>
      <a href="shop.html" class="w-full flex-1 px-6 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition-all text-center flex items-center justify-center gap-2">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i> Browse Shop
      </a>
    </div>

  </main>

  <!-- BOTTOM SIMPLE COPYRIGHT -->
  <div class="mt-8 text-center text-xs text-slate-400 z-10">
    <p>&copy; 2026 ApplianceHub Inc. All rights reserved. <span class="hidden sm:inline">| Developed by <strong class="text-hub-blue">Abhivorn Technologies Pvt.Ltd.</strong></span></p>
  </div>

  <!-- RTL & THEME TOGGLE LOGIC -->
  <script>
    function toggleRTL() {
      const htmlElement = document.documentElement;
      if (htmlElement.getAttribute('dir') === 'rtl') {
        htmlElement.setAttribute('dir', 'ltr');
      } else {
        htmlElement.setAttribute('dir', 'rtl');
      }
    }

    function toggleDarkMode() {
      if (window.appThemeToggle) return window.appThemeToggle();
      const htmlElement = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (htmlElement.classList.contains('dark')) {
        htmlElement.classList.remove('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        htmlElement.classList.add('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
      }
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
