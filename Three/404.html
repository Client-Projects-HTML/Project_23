<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>404 - Page Not Found | ApplianceHub</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0B132B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-hub-blue selection:text-white min-h-screen flex flex-col justify-between">

  <!-- MAIN 404 CONTENT -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-10 text-center space-y-6 border border-slate-100 mx-4">
      
      <!-- ICON CONTAINER -->
      <div class="mx-auto w-16 h-16 sm:w-20 sm:h-20 bg-green-50 rounded-2xl flex items-center justify-center border border-green-100">
        <i data-lucide="wrench" class="w-8 h-8 sm:w-10 sm:h-10 text-green-600"></i>
      </div>

      <!-- ERROR MESSAGE -->
      <div class="space-y-3">
        <h1 class="text-5xl sm:text-6xl font-black text-green-600 tracking-tight">404</h1>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Page Not Found</h2>
        <p class="text-sm text-slate-500 max-w-xs mx-auto leading-relaxed px-2">
          The appliance, service, or page you are looking for has been moved or is temporarily unavailable.
        </p>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 pt-4">
        <a href="index.html" class="w-full flex-1 px-4 sm:px-6 py-3.5 rounded-xl bg-green-600 hover:bg-green-700 text-white text-sm font-bold shadow-md shadow-green-600/20 transition-all text-center">
          Back to Home
        </a>
        <a href="shop.html" class="w-full flex-1 px-4 sm:px-6 py-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold transition-all text-center">
          Start Shopping
        </a>
      </div>

    </div>
  </main>



  <!-- SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
