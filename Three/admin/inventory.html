<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Inventory Management | ApplianceHub Admin</title>
  <script src="js/admin-auth.js"></script>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontSize: {
            'xl': ['1.125rem', { lineHeight: '1.75rem' }],
            '2xl': ['1.25rem', { lineHeight: '1.75rem' }],
            '3xl': ['1.5rem', { lineHeight: '2rem' }],
            '4xl': ['1.75rem', { lineHeight: '2.25rem' }],
            '5xl': ['2.25rem', { lineHeight: '2.5rem' }],
            '6xl': ['2.75rem', { lineHeight: '1' }],
            '7xl': ['3.25rem', { lineHeight: '1' }],
          },
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0B132B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white min-h-screen flex overflow-hidden">

  <!-- OVERLAY FOR MOBILE SIDEBAR -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[60] hidden lg:hidden"></div>

  <!-- SIDEBAR / SLIDER NAVIGATION -->
  <aside id="adminSidebar" class="fixed lg:static top-0 end-0 bottom-0 w-64 bg-slate-900 border-s border-slate-800/60 z-[70] flex flex-col justify-between translate-x-full rtl:-translate-x-full lg:!translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
    
    <div>
      <!-- SIDEBAR HEADER -->
      <div class="h-16 px-6 border-b border-slate-800/60 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center gap-2.5">
          <div class="w-7 h-7 sm:w-9 sm:h-9 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-xl flex items-center justify-center font-bold text-sm shadow-md shadow-hub-blue/20">
            <i data-lucide="wrench" class="w-4 h-4"></i>
          </div>
          <span class="font-extrabold text-base sm:text-lg tracking-tight text-white leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
        </a>
        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- SIDEBAR MENU ITEMS -->
      <nav class="p-4 space-y-1.5 text-xs font-bold">
        <a href="dashboard.html" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard Overview</span>
        </a>

        <a href="inventory.html" class="flex items-center gap-3 px-3.5 py-3 rounded-xl bg-hub-blue/10 text-hub-blue border border-hub-blue/20 transition-all">
          <i data-lucide="package" class="w-4 h-4"></i>
          <span>Inventory Management</span>
        </a>

        <a href="repair-jobs.html" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
          <i data-lucide="wrench" class="w-4 h-4"></i>
          <span>Repair Jobs</span>
        </a>

        <a href="customers.html" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>Customer Records</span>
        </a>
      </nav>
    </div>

    <!-- SIDEBAR FOOTER (USER INFO & LOGOUT) -->
    <div class="p-4 border-t border-slate-800/60 space-y-3">
      <div class="flex items-center gap-3 px-2">
        <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-white">
          A
        </div>
        <div class="overflow-hidden">
          <span class="text-xs font-bold text-white block truncate">Admin User</span>
          <span class="text-[10px] text-slate-400 block truncate">admin@storelogo.com</span>
        </div>
      </div>

      <a href="../login.html" onclick="localStorage.removeItem('isAdminLoggedIn')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-rose-500/10 hover:text-rose-400 border border-slate-700 text-slate-300 text-xs font-bold transition-all flex items-center justify-center gap-2">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Log Out
      </a>
    </div>

  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto min-w-0">
    
    <!-- TOP HEADER -->
    <header class="h-16 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/60 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-40 shrink-0 w-full shadow-sm">
      <div class="flex items-center gap-3">
        <!-- Mobile Logo -->
        <a href="../index.html" class="flex lg:hidden items-center gap-1.5 shrink-0">
          <div class="w-7 h-7 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-md shadow-hub-blue/20">
            <i data-lucide="wrench" class="w-3.5 h-3.5"></i>
          </div>
          <span class="font-extrabold text-sm tracking-tight text-white leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
        </a>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2.5">
        <!-- RTL TOGGLE -->
        <button id="rtlToggleBtn" onclick="toggleAdminRTL()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="Toggle Direction (LTR/RTL)">
          <i data-lucide="languages" class="w-4 h-4"></i>
        </button>

        <!-- DARK / LIGHT TOGGLE -->
        <button id="themeToggleBtn" onclick="toggleAdminDarkMode()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="Toggle Dark/Light Mode">
          <i data-lucide="moon" id="adminThemeIcon" class="w-4 h-4"></i>
        </button>

        <!-- MOBILE MENU BTN ON RIGHT -->
        <button onclick="toggleSidebar()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all lg:hidden" title="Open Navigation Menu">
          <i data-lucide="menu" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- INVENTORY MAIN CONTENT -->
    <main class="p-4 sm:p-6 lg:p-8 flex-1 space-y-6">
      
      <!-- PAGE TITLE -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-2">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Inventory & Stock</h1>
          <p class="text-xs text-slate-400 mt-1">Manage your product catalog and stock levels.</p>
        </div>
        <button onclick="openAddModal()" class="px-4 py-2.5 rounded-xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold transition-all flex items-center gap-2 shadow-lg shadow-hub-blue/20">
          <i data-lucide="plus" class="w-4 h-4"></i> <span>Add New Product</span>
        </button>
      </div>

      <!-- CONTROLS & FILTERS -->
      <div class="flex flex-col sm:flex-row justify-between gap-4">
        <!-- SEARCH -->
        <div class="relative flex-1 max-w-md">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
          <input type="text" id="searchInput" onkeyup="filterInventory()" placeholder="Search product name, SKU, or category..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-800/60 bg-slate-900 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-hub-blue">
        </div>

        <!-- CATEGORY FILTER -->
        <div class="flex items-center gap-2">
          <select id="categoryFilter" onchange="filterInventory()" class="px-3 py-2.5 rounded-xl border border-slate-800/60 bg-slate-900 text-xs text-slate-300 focus:outline-none focus:ring-2 focus:ring-hub-blue">
            <option value="ALL">All Categories</option>
            <option value="Refrigerators">Refrigerators</option>
            <option value="Washing Machines">Washing Machines</option>
            <option value="Air Conditioners">Air Conditioners</option>
            <option value="Microwaves">Microwaves</option>
            <option value="Spare Parts">Spare Parts</option>
          </select>
        </div>
      </div>

      <!-- INVENTORY TABLE CONTAINER -->
      <div class="bg-slate-900 border border-slate-800/60 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 border-b border-slate-800/60 uppercase tracking-wider text-[10px]">
              <tr>
                <th class="py-3.5 px-4 font-bold">SKU</th>
                <th class="py-3.5 px-4 font-bold">Product Name</th>
                <th class="py-3.5 px-4 font-bold">Category</th>
                <th class="py-3.5 px-4 font-bold">Price</th>
                <th class="py-3.5 px-4 font-bold">Stock</th>
                <th class="py-3.5 px-4 font-bold">Status</th>
                <th class="py-3.5 px-4 font-bold text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody" class="divide-y divide-slate-800/80 text-slate-300">
              <!-- Dynamically populated or rendered items -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  
  </div>

  <!-- ADD PRODUCT MODAL -->
  <div id="addProductModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800/60 rounded-3xl w-full max-w-lg p-6 space-y-6 shadow-2xl">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800/60">
        <h3 class="font-extrabold text-base text-white">Add New Product</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="handleAddProduct(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Product Name</label>
          <input type="text" id="prodName" required placeholder="e.g. LG Dual Inverter Fridge" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Category</label>
            <select id="prodCategory" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
              <option value="Refrigerators">Refrigerators</option>
              <option value="Washing Machines">Washing Machines</option>
              <option value="Air Conditioners">Air Conditioners</option>
              <option value="Microwaves">Microwaves</option>
              <option value="Spare Parts">Spare Parts</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">SKU Code</label>
            <input type="text" id="prodSKU" required placeholder="APP-892" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Price ($)</label>
            <input type="number" step="0.01" id="prodPrice" required placeholder="899.00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Stock Quantity</label>
            <input type="number" id="prodStock" required placeholder="15" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800/60">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-bold">Cancel</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/20">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin-theme.js"></script>

  <!-- SCRIPT -->
  <script>
    let inventory = [
      { sku: 'APP-101', name: 'LG French Door Refrigerator 580L', category: 'Refrigerators', price: 1299.00, stock: 12 },
      { sku: 'APP-102', name: 'Samsung Front Load Washer 9kg', category: 'Washing Machines', price: 749.00, stock: 8 },
      { sku: 'APP-103', name: 'Whirlpool Split AC 1.5 Ton 5 Star', category: 'Air Conditioners', price: 599.00, stock: 3 },
      { sku: 'APP-104', name: 'Panasonic Convection Microwave 27L', category: 'Microwaves', price: 210.00, stock: 18 },
      { sku: 'APP-105', name: 'Universal Washer Drain Pump Motor', category: 'Spare Parts', price: 45.00, stock: 1 }
    ];

    function renderInventory(items) {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500 font-medium">No matching products found.</td></tr>`;
        return;
      }

      items.forEach((item, index) => {
        let statusBadge = '';
        if (item.stock === 0) {
          statusBadge = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">Out of Stock</span>`;
        } else if (item.stock <= 5) {
          statusBadge = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">Low Stock</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">In Stock</span>`;
        }

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition-colors';
        tr.innerHTML = `
          <td class="py-3.5 px-4 font-mono font-bold text-white">${item.sku}</td>
          <td class="py-3.5 px-4 font-bold text-white">${item.name}</td>
          <td class="py-3.5 px-4 text-slate-400">${item.category}</td>
          <td class="py-3.5 px-4 font-extrabold text-white">$${item.price.toFixed(2)}</td>
          <td class="py-3.5 px-4 font-bold">${item.stock}</td>
          <td class="py-3.5 px-4">${statusBadge}</td>
          <td class="py-3.5 px-4 text-right space-x-2">
            <button onclick="deleteProduct(${index})" class="text-rose-400 hover:text-rose-300 font-bold hover:underline">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterInventory() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = inventory.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query) || item.sku.toLowerCase().includes(query);
        const matchesCategory = (cat === 'ALL') || (item.category === cat);
        return matchesQuery && matchesCategory;
      });

      renderInventory(filtered);
    }

    function deleteProduct(index) {
      if (confirm('Are you sure you want to delete this inventory item?')) {
        inventory.splice(index, 1);
        filterInventory();
      }
    }

    function openAddModal() {
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const newItem = {
        name: document.getElementById('prodName').value,
        category: document.getElementById('prodCategory').value,
        sku: document.getElementById('prodSKU').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        stock: parseInt(document.getElementById('prodStock').value)
      };

      inventory.unshift(newItem);
      closeAddModal();
      filterInventory();
      e.target.reset();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('adminSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (!sidebar || !overlay) return;
      const isRtl = document.documentElement.getAttribute('dir') === 'rtl';
      const closedClass = isRtl ? '-translate-x-full' : 'translate-x-full';

      if (sidebar.classList.contains('translate-x-full') || sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('translate-x-full', '-translate-x-full', 'rtl:translate-x-full', 'rtl:-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add(closedClass);
        overlay.classList.add('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderInventory(inventory);
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
