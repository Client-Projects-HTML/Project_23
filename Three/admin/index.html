<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Admin Login | ApplianceHub</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontSize: {
            'xl': ['1.125rem', { lineHeight: '1.75rem' }],
            '2xl': ['1.25rem', { lineHeight: '1.75rem' }],
            '3xl': ['1.5rem', { lineHeight: '2rem' }],
            '4xl': ['1.75rem', { lineHeight: '2.25rem' }],
            '5xl': ['2.25rem', { lineHeight: '2.5rem' }],
            '6xl': ['2.75rem', { lineHeight: '1' }],
            '7xl': ['3.25rem', { lineHeight: '1' }],
          },
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0B132B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white min-h-screen flex flex-col justify-between overflow-hidden">

  <!-- TOP BAR -->
  <div class="bg-slate-900/80 text-slate-400 text-xs py-2 px-4 border-b border-slate-800/60">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-medium text-slate-300 hidden sm:inline">StoreLogo Admin Access</span>
      </div>
      <div class="flex items-center gap-2">
        <!-- RTL TOGGLE (3-MINUS / 3-DASH SYMBOL) -->
        <button id="rtlToggleBtn" onclick="toggleAdminRTL()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="Toggle Direction (LTR/RTL)">
          <i data-lucide="globe" class="w-4 h-4"></i>
        </button>
        <!-- DARK / LIGHT TOGGLE -->
        <button id="themeToggleBtn" onclick="toggleAdminDarkMode()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="Toggle Dark/Light Mode">
          <i data-lucide="moon" id="adminThemeIcon" class="w-3.5 h-3.5"></i>
        </button>
        <a href="../index.html" class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Main Store</span>
        </a>
      </div>
    </div>
  </div>

  <!-- LOGIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 overflow-y-auto">
    <div class="w-full max-w-md space-y-6">
      
      <div class="bg-slate-900 border border-slate-800/60 p-8 rounded-3xl shadow-2xl space-y-6">
        
        <!-- HEADER -->
        <div class="text-center space-y-2">
          <div class="w-14 h-14 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-hub-blue/20">
            <i data-lucide="wrench" class="w-7 h-7"></i>
          </div>
          <div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Admin Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Please authenticate to continue</p>
          </div>
        </div>

        <!-- FORM -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Email / Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 start-0 ps-3.5 flex items-center text-slate-500">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input type="text" required value="admin@storelogo.com" class="w-full ps-10 pe-4 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 start-0 ps-3.5 flex items-center text-slate-500">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input type="password" required value="admin123" class="w-full ps-10 pe-4 py-2.5 rounded-xl border border-slate-800/60 bg-slate-950 text-xs text-white focus:outline-none focus:ring-2 focus:ring-hub-blue">
            </div>
          </div>

          <p id="loginError" class="hidden text-[11px] font-semibold text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl px-3 py-2 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i> Invalid email or password. Please try again.
          </p>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-hub-blue hover:bg-hub-blueDark text-white text-xs font-bold shadow-lg shadow-hub-blue/25 transition-all flex items-center justify-center gap-2">
            <span>Login to Admin Dashboard</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

      </div>

    </div>
  </main>

  

  <script src="js/admin-theme.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = e.target.querySelector('input[type="text"]').value.trim();
      const password = e.target.querySelector('input[type="password"]').value;
      const errorEl = document.getElementById('loginError');

      // Demo credentials pre-filled in the form above
      if (email === 'admin@storelogo.com' && password === 'admin123') {
        localStorage.setItem('isAdminLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorEl.classList.remove('hidden');
      }
    }

    // Already signed in? Skip the login screen.
    if (localStorage.getItem('isAdminLoggedIn') === 'true') {
      window.location.replace('dashboard.html');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
