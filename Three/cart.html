<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Shopping Cart | ApplianceHub</title>

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              blue: '#0284C7',
              blueDark: '#0369A1',
              orange: '#EA580C',
              dark: '#0F172A',
              light: '#F8FAFC',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-hub-light dark:bg-slate-900 text-hub-dark dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-hub-border dark:border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-md shadow-hub-blue/20">
          <i data-lucide="wrench" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-hub-dark dark:text-white block leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5 block">Store & Service</span>
        </div>
      </a>

      <div class="flex items-center gap-4">
        <a href="shop.html" class="text-xs font-bold text-hub-blue hover:underline flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Continue Shopping
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CART CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
    <h1 class="text-2xl font-extrabold mb-6 flex items-center gap-2">
      <i data-lucide="shopping-cart" class="w-6 h-6 text-hub-blue"></i> Your Cart
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- CART ITEMS LIST CONTAINER -->
      <div class="lg:col-span-2 space-y-4">
        <div id="cartItemsContainer" class="space-y-4">
          <!-- Dynamic Items Will Render Here via JS -->
        </div>

        <!-- EMPTY CART MESSAGE -->
        <div id="emptyCartMsg" class="hidden bg-white dark:bg-slate-800 rounded-3xl p-10 text-center border border-hub-border dark:border-slate-700 space-y-4">
          <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mx-auto text-slate-400">
            <i data-lucide="shopping-bag" class="w-8 h-8"></i>
          </div>
          <h2 class="text-lg font-bold">Your cart is empty</h2>
          <p class="text-xs text-slate-400">Looks like you haven't added any products to your cart yet.</p>
          <a href="shop.html" class="inline-block px-6 py-2.5 rounded-xl bg-hub-blue text-white text-xs font-bold shadow-md hover:bg-hub-blueDark transition-all">
            Browse Appliances
          </a>
        </div>
      </div>

      <!-- ORDER SUMMARY SIDEBAR -->
      <div id="cartSummary" class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-hub-border dark:border-slate-700 h-fit space-y-4">
        <h2 class="font-extrabold text-base border-b border-slate-100 dark:border-slate-700 pb-3">Order Summary</h2>
        
        <div class="space-y-2 text-xs font-medium text-slate-500 dark:text-slate-400">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span id="subtotalVal" class="font-bold text-hub-dark dark:text-white">$0.00</span>
          </div>
          <div class="flex justify-between">
            <span>Estimated Shipping</span>
            <span class="text-emerald-500 font-bold">FREE</span>
          </div>
        </div>

        <div class="border-t border-slate-100 dark:border-slate-700 pt-3 flex justify-between items-center">
          <span class="font-bold text-sm">Total</span>
          <span id="totalVal" class="font-extrabold text-xl text-hub-blue">$0.00</span>
        </div>

        <button onclick="checkout()" class="w-full py-3 rounded-2xl bg-hub-orange text-white text-xs font-bold shadow-md hover:bg-orange-600 transition-all flex items-center justify-center gap-2">
          Proceed to Checkout <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- JAVASCRIPT FOR CART MANAGEMENT -->
  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem('applianceHubCart')) || [];
    }

    function saveCart(cart) {
      localStorage.setItem('applianceHubCart', JSON.stringify(cart));
      renderCart();
    }

    function parsePrice(priceStr) {
      return parseFloat(priceStr.replace(/[^0-9.-]+/g, '')) || 0;
    }

    function changeQuantity(id, delta) {
      let cart = getCart();
      const item = cart.find(i => i.id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      saveCart(cart);
    }

    function removeItem(id) {
      let cart = getCart();
      cart = cart.filter(i => i.id !== id);
      saveCart(cart);
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartItemsContainer');
      const emptyMsg = document.getElementById('emptyCartMsg');
      const summary = document.getElementById('cartSummary');

      if (cart.length === 0) {
        container.innerHTML = '';
        emptyMsg.classList.remove('hidden');
        summary.classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('subtotalVal').innerText = '$0.00';
        document.getElementById('totalVal').innerText = '$0.00';
        return;
      }

      emptyMsg.classList.add('hidden');
      summary.classList.remove('opacity-50', 'pointer-events-none');

      let subtotal = 0;
      container.innerHTML = cart.map(item => {
        const numericPrice = parsePrice(item.price);
        const itemTotal = numericPrice * item.quantity;
        subtotal += itemTotal;

        return `
          <div class="bg-white dark:bg-slate-800 rounded-3xl p-4 border border-hub-border dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 w-full sm:w-auto">
              <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-2xl bg-slate-100 dark:bg-slate-900 shrink-0">
              <div>
                <h3 class="font-bold text-sm text-hub-dark dark:text-white">${item.name}</h3>
                <span class="text-xs text-hub-blue font-extrabold">${item.price}</span>
              </div>
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 dark:border-slate-700">
              <!-- QUANTITY CONTROLS -->
              <div class="flex items-center border border-hub-border dark:border-slate-700 rounded-xl overflow-hidden bg-slate-50 dark:bg-slate-900">
                <button onclick="changeQuantity(${item.id}, -1)" class="px-2.5 py-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-xs">-</button>
                <span class="px-3 py-1 text-xs font-bold">${item.quantity}</span>
                <button onclick="changeQuantity(${item.id}, 1)" class="px-2.5 py-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-xs">+</button>
              </div>

              <!-- ITEM TOTAL -->
              <span class="font-extrabold text-sm min-w-[70px] text-right">$${itemTotal.toFixed(2)}</span>

              <!-- DELETE BUTTON -->
              <button onclick="removeItem(${item.id})" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all" title="Remove Item">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('subtotalVal').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('totalVal').innerText = `$${subtotal.toFixed(2)}`;

      if (window.lucide) lucide.createIcons();
    }

    function checkout() {
      alert('Redirecting to checkout processing...');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });
  </script>
</body>
</html>
