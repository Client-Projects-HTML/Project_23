<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Sign Up | ApplianceHub</title>
  <meta name="description" content="Create an ApplianceHub account to track orders, manage service requests, or access admin management portals.">

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: { blue: '#0284C7', blueDark: '#0369A1', orange: '#EA580C', dark: '#0F172A', light: '#F8FAFC', border: '#E2E8F0' }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/mobile-nav.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/theme.js?v=2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-hub-blue selection:text-white transition-colors duration-200 min-h-screen flex flex-col justify-between">

  <!-- HEADER (BRAND LOGO + RTL & THEME TOGGLES ONLY) -->
  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-hub-border dark:border-slate-800 sticky top-0 z-50 transition-all shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- BRAND LOGO -->
      <a href="index.html" class="flex items-center gap-1.5 sm:gap-3 shrink-0">
        <div class="w-7 h-7 sm:w-10 sm:h-10 bg-gradient-to-tr from-hub-blueDark to-hub-blue text-white rounded-lg sm:rounded-2xl flex items-center justify-center font-bold text-xs sm:text-xl shadow-md shadow-hub-blue/20">
          <i data-lucide="wrench" class="w-3.5 h-3.5 sm:w-5 sm:h-5"></i>
        </div>
        <div>
          <span class="font-extrabold text-sm sm:text-xl tracking-tight text-hub-dark dark:text-white block leading-none">Appliance<span class="text-hub-blue">Hub</span></span>
        </div>
      </a>

      <!-- RTL & THEME TOGGLE BUTTONS -->
      <div class="flex items-center gap-2">
        <button id="rtlToggleBtn" onclick="toggleRTL()" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-all shrink-0" title="Toggle Direction (LTR/RTL)">
          <i data-lucide="globe" class="w-4 h-4"></i>
        </button>

        <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-all shrink-0" title="Toggle Dark/Light Mode">
          <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- SIGN UP MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-[440px]">
      <div class="bg-white dark:bg-slate-800 border border-hub-border dark:border-slate-700/80 p-8 sm:p-10 rounded-[32px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none space-y-6">

        <!-- TITLE & SUBTITLE -->
        <div class="text-center space-y-2">
          <h1 id="signupTitle" class="font-extrabold text-2xl tracking-tight text-slate-900 dark:text-white">Create Account</h1>
          <p id="signupSubtitle" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 max-w-xs mx-auto leading-relaxed">
            Join ApplianceHub to track appliance deliveries, schedule instant doorstep repairs, and unlock warranty benefits.
          </p>
        </div>

        <!-- USER & ADMIN TABS -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-2xl">
          <button type="button" id="tabUserBtn" onclick="switchSignUpType('user')" class="flex-1 py-2.5 rounded-xl text-[11px] font-extrabold transition-all flex items-center justify-center gap-1.5 bg-hub-blue text-white shadow-sm">
            <i data-lucide="user" class="w-3.5 h-3.5"></i> User Account
          </button>
          <button type="button" id="tabAdminBtn" onclick="switchSignUpType('admin')" class="flex-1 py-2.5 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
            <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin Staff
          </button>
        </div>

        <!-- ALERTS -->
        <div id="authError" class="hidden text-[11px] font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/20 rounded-xl px-3.5 py-2.5 flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span id="authErrorText"></span>
        </div>

        <div id="authSuccess" class="hidden text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 rounded-xl px-3.5 py-2.5 flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
          <span id="authSuccessText"></span>
        </div>

        <!-- SIGN UP FORM -->
        <form onsubmit="handleSignUp(event)" class="space-y-4">
          
          <div class="space-y-1.5">
            <label class="block text-[11px] font-extrabold text-slate-700 dark:text-slate-300">Full Name</label>
            <input type="text" id="nameInput" required placeholder="John Doe" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-[13px] text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue focus:border-transparent transition-all placeholder:text-slate-400 font-medium">
          </div>

          <div class="space-y-1.5">
            <label class="block text-[11px] font-extrabold text-slate-700 dark:text-slate-300">Email Address</label>
            <input type="email" id="emailInput" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-[13px] text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue focus:border-transparent transition-all placeholder:text-slate-400 font-medium">
          </div>

          <div class="space-y-1.5">
            <label class="block text-[11px] font-extrabold text-slate-700 dark:text-slate-300">Password</label>
            <div class="relative">
              <input type="password" id="signupPass" required placeholder="At least 8 characters" class="w-full ps-4 pe-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-[13px] text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-blue focus:border-transparent transition-all placeholder:text-slate-400 font-medium tracking-widest">
              <button type="button" onclick="togglePasswordVisibility('signupPass', this)" class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- ADMIN STAFF ACCESS KEY FIELD (SHOWN ONLY FOR ADMIN TAB) -->
          <div id="adminKeyContainer" class="space-y-1.5 hidden">
            <label class="block text-[11px] font-extrabold text-amber-600 dark:text-amber-400">Staff Verification Key</label>
            <input type="password" id="adminSecretInput" placeholder="Enter employee access key" class="w-full px-4 py-3 rounded-xl border border-amber-300 dark:border-amber-700/80 bg-amber-50/50 dark:bg-amber-950/20 text-[13px] text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-hub-orange focus:border-transparent transition-all placeholder:text-slate-400 font-medium">
          </div>

          <div class="flex items-start gap-2 pt-1">
            <input type="checkbox" required id="agreeTerms" class="w-3.5 h-3.5 mt-0.5 rounded border-slate-300 dark:border-slate-600 text-hub-blue focus:ring-hub-blue bg-white dark:bg-slate-900">
            <label for="agreeTerms" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-tight cursor-pointer">
              I agree to the <a href="coming-soon.html" id="termsLink" class="text-hub-blue font-bold hover:underline">Terms of Service</a> and <a href="coming-soon.html" id="privacyLink" class="text-hub-blue font-bold hover:underline">Privacy Policy</a>
            </label>
          </div>

          <button id="signupSubmitBtn" type="submit" class="w-full py-3.5 rounded-xl bg-hub-blue hover:bg-hub-blueDark text-white text-[13px] font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-hub-blue/20 mt-2">
            <i data-lucide="user-plus" class="w-4 h-4"></i> <span id="submitBtnText">Create Free Account</span>
          </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-700/60">
          <p class="text-[11px] text-slate-400 font-medium">
            Already have an account?
            <a href="login.html" id="signinLink" class="text-hub-blue font-bold hover:underline">Sign In</a>
          </p>
        </div>

      </div>
    </div>
  </main>

  <script>
    let currentSignUpType = 'user';

    function switchSignUpType(type) {
      currentSignUpType = type;
      hideAlerts();

      const title = document.getElementById('signupTitle');
      const subtitle = document.getElementById('signupSubtitle');
      const tabUser = document.getElementById('tabUserBtn');
      const tabAdmin = document.getElementById('tabAdminBtn');
      const submitBtn = document.getElementById('signupSubmitBtn');
      const submitBtnText = document.getElementById('submitBtnText');
      const nameInput = document.getElementById('nameInput');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('signupPass');
      const adminKeyContainer = document.getElementById('adminKeyContainer');
      const adminSecretInput = document.getElementById('adminSecretInput');
      const agreeTerms = document.getElementById('agreeTerms');
      const termsLink = document.getElementById('termsLink');
      const privacyLink = document.getElementById('privacyLink');
      const signinLink = document.getElementById('signinLink');

      const userClasses = ['bg-hub-blue', 'text-white', 'shadow-sm', 'font-extrabold'];
      const adminClasses = ['bg-hub-orange', 'text-white', 'shadow-sm', 'font-extrabold'];
      const inactiveClasses = ['text-slate-500', 'dark:text-slate-400', 'hover:text-slate-700', 'dark:hover:text-slate-200', 'font-bold'];

      // Reset tabs & input focus states
      tabUser.className = 'flex-1 py-2.5 rounded-xl text-[11px] transition-all flex items-center justify-center gap-1.5';
      tabAdmin.className = 'flex-1 py-2.5 rounded-xl text-[11px] transition-all flex items-center justify-center gap-1.5';

      if (type === 'user') {
        title.innerText = 'Create User Account';
        subtitle.innerText = 'Join ApplianceHub to track appliance deliveries, schedule instant doorstep repairs, and unlock warranty benefits.';
        nameInput.placeholder = 'John Doe';
        emailInput.placeholder = 'name@example.com';
        submitBtnText.innerText = 'Create Free Account';
        
        adminKeyContainer.classList.add('hidden');
        adminSecretInput.removeAttribute('required');

        tabUser.classList.add(...userClasses);
        tabAdmin.classList.add(...inactiveClasses);

        // Styling accents
        nameInput.classList.replace('focus:ring-hub-orange', 'focus:ring-hub-blue');
        emailInput.classList.replace('focus:ring-hub-orange', 'focus:ring-hub-blue');
        passwordInput.classList.replace('focus:ring-hub-orange', 'focus:ring-hub-blue');
        agreeTerms.classList.replace('text-hub-orange', 'text-hub-blue');
        agreeTerms.classList.replace('focus:ring-hub-orange', 'focus:ring-hub-blue');

        termsLink.className = 'text-hub-blue font-bold hover:underline';
        privacyLink.className = 'text-hub-blue font-bold hover:underline';
        signinLink.className = 'text-hub-blue font-bold hover:underline';

        submitBtn.className = 'w-full py-3.5 rounded-xl bg-hub-blue hover:bg-hub-blueDark text-white text-[13px] font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-hub-blue/20 mt-2';
      } else {
        title.innerText = 'Register Admin Staff';
        subtitle.innerText = 'Register an authorized administrator account to manage store inventory, technician dispatches, and sales reports.';
        nameInput.placeholder = 'Staff Member Name';
        emailInput.placeholder = 'admin.name@appliancehub.com';
        submitBtnText.innerText = 'Register Admin Account';

        adminKeyContainer.classList.remove('hidden');
        adminSecretInput.setAttribute('required', 'true');

        tabAdmin.classList.add(...adminClasses);
        tabUser.classList.add(...inactiveClasses);

        // Styling accents
        nameInput.classList.replace('focus:ring-hub-blue', 'focus:ring-hub-orange');
        emailInput.classList.replace('focus:ring-hub-blue', 'focus:ring-hub-orange');
        passwordInput.classList.replace('focus:ring-hub-blue', 'focus:ring-hub-orange');
        agreeTerms.classList.replace('text-hub-blue', 'text-hub-orange');
        agreeTerms.classList.replace('focus:ring-hub-blue', 'focus:ring-hub-orange');

        termsLink.className = 'text-hub-orange font-bold hover:underline';
        privacyLink.className = 'text-hub-orange font-bold hover:underline';
        signinLink.className = 'text-hub-orange font-bold hover:underline';

        submitBtn.className = 'w-full py-3.5 rounded-xl bg-hub-orange hover:bg-orange-600 text-white text-[13px] font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-hub-orange/20 mt-2';
      }
    }

    function handleSignUp(event) {
      event.preventDefault();
      hideAlerts();

      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('signupPass').value.trim();

      if (!name || !email || !password) {
        showError('Please complete all required fields.');
        return;
      }

      if (currentSignUpType === 'user') {
        localStorage.setItem('isCustomerLoggedIn', 'true');
        localStorage.setItem('customerEmail', email);
        localStorage.setItem('customerName', name);
        showSuccess('User account registered successfully! Redirecting...');
        setTimeout(() => { window.location.href = 'user-dashboard.html'; }, 900);
      } else {
        const adminKey = document.getElementById('adminSecretInput').value.trim();
        if (!adminKey) {
          showError('Staff Verification Key is required for admin registration.');
          return;
        }
        localStorage.setItem('isAdminLoggedIn', 'true');
        localStorage.setItem('adminEmail', email);
        localStorage.setItem('adminName', name);
        showSuccess('Admin staff account registered! Redirecting to admin panel...');
        setTimeout(() => { window.location.href = 'admin/dashboard.html'; }, 900);
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
      if (window.lucide) lucide.createIcons();
    }

    function showError(message) {
      const el = document.getElementById('authError');
      document.getElementById('authErrorText').innerText = message;
      el.classList.remove('hidden');
    }

    function showSuccess(message) {
      const el = document.getElementById('authSuccess');
      document.getElementById('authSuccessText').innerText = message;
      el.classList.remove('hidden');
    }

    function hideAlerts() {
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authSuccess').classList.add('hidden');
    }

    function toggleRTL() {
      const htmlElement = document.documentElement;
      if (htmlElement.getAttribute('dir') === 'rtl') {
        htmlElement.setAttribute('dir', 'ltr');
      } else {
        htmlElement.setAttribute('dir', 'rtl');
      }
    }

    function toggleDarkMode() {
      if (window.appThemeToggle) return window.appThemeToggle();
      const htmlElement = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');

      if (htmlElement.classList.contains('dark')) {
        htmlElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        htmlElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      }

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
